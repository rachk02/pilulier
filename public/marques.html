<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="/css/theme.css">
<style>body{background:var(--paper);color:var(--ink);font-family:var(--font);margin:0;padding:26px}
h1{font-size:12px;text-transform:uppercase;letter-spacing:.16em;margin:0 0 18px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.g{display:flex;gap:0;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.g>div{flex:1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper-hi);padding:20px 10px;text-align:center}
.g span{display:block;width:64px;height:64px;margin:0 auto}
.g svg{width:100%;height:100%}
.g small{display:block;margin-top:12px;font-size:12px;font-weight:700}
.g em{display:block;font-style:normal;font-size:9px;color:var(--ink-3);margin-top:3px}
.sizes{display:flex;gap:18px;align-items:center;border:1px solid var(--rule);background:var(--paper-hi);padding:16px;margin-top:18px}
.sizes span{display:block}
</style>
