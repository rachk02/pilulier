<!doctype html><meta charset="utf-8"><title>Pilulier — planche des dessins</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
 body{background:var(--paper);color:var(--ink);font-family:var(--font);margin:0;padding:20px}
 h1{font-size:12px;text-transform:uppercase;letter-spacing:.16em;margin:0 0 14px;
    padding-bottom:8px;border-bottom:1px solid var(--rule)}
 h2{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);
    margin:26px 0 10px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:0;
       border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
 .cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
       padding:10px 4px;text-align:center;background:var(--paper-hi)}
 .cell svg{width:32px;height:32px;margin:0 auto}
 .cell small{display:block;margin-top:6px;font-size:9px;color:var(--ink-3)}
 .sizes{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
        border:1px solid var(--rule);padding:12px;background:var(--paper-hi)}
 .sizes div{text-align:center}
 .sizes small{display:block;font-size:9px;color:var(--ink-3)}
 .scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0;
         border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
 .scenes div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
             padding:14px;background:var(--paper-hi);text-align:center}
 .scenes svg{width:100%;height:auto}
 .inv{background:var(--ink);color:var(--paper)}
</style>
<h1>Pilulier — tout ce que le code dessine</h1>
<h2>La marque</h2>
<div class="sizes" id="marks"></div>
<h2>Icônes d'interface (32 px)</h2>
<div class="grid" id="icons"></div>
<h2>Lisibilité réelle — 16, 18, 20, 24 px</h2>
<div class="sizes" id="small"></div>
<h2>Illustrations d'écran vide</h2>
<div class="scenes" id="scenes"></div>
<h2>Tampon « journée complète »</h2>
<div class="sizes"><div id="stamp"></div></div>
<script type="module">
import { ico, ICON_NAMES } from '/js/icons.js';
import { logoMark, emptyIllus, SCENE_NAMES, doneStamp } from '/js/illus.js';

const marks = document.getElementById('marks');
for (const s of [96, 64, 48, 32, 24]) {
  const d = document.createElement('div');
  d.innerHTML = `<span style="display:block;width:${s}px;height:${s}px">${logoMark({size:100})}</span>`;
  d.insertAdjacentHTML('beforeend', `<small>${s} px</small>`);
  marks.append(d);
}
const wrap = document.getElementById('icons');
for (const n of ICON_NAMES) {
  const d = document.createElement('div'); d.className = 'cell';
  d.innerHTML = ico(n) + `<small>${n}</small>`;
  wrap.append(d);
}
const sm = document.getElementById('small');
const sample = ['pill','capsule','drop','syringe','settings','sun','trash','clock','bell',
                'chart','shield','camera','box','check','logo','today'];
for (const px of [16,18,20,24]) {
  const row = document.createElement('div');
  row.innerHTML = sample.map(n =>
    `<span style="display:inline-block;width:${px}px;height:${px}px;margin:0 3px">${ico(n)}</span>`).join('');
  row.insertAdjacentHTML('beforeend', `<small>${px} px</small>`);
  sm.append(row);
}
const sc = document.getElementById('scenes');
for (const n of SCENE_NAMES) {
  const d = document.createElement('div');
  d.innerHTML = emptyIllus(n) + `<small style="font-size:9px;color:var(--ink-3)">${n}</small>`;
  sc.append(d);
}
document.getElementById('stamp').innerHTML =
  `<span style="display:block;width:110px;height:110px">${doneStamp()}</span>`;
</script>
